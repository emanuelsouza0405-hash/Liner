name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [mobile]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        run: |
          set -o pipefail
          {
            pnpm install --no-frozen-lockfile
            pnpm build:android-web
            pnpm exec cap add android
            node scripts/setup-android.mjs
            pnpm exec cap sync android
            node scripts/setup-android.mjs
            cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
          } 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Publicar log do build
        if: always()
        run: |
          cd "$RUNNER_TEMP"
          rm -rf logrepo && mkdir logrepo && cd logrepo
          git init -q && git checkout -q -b build-log
          tail -n 400 ../build.log | sed 's/\x1b\[[0-9;]*m//g' > build.log
          git add build.log
          git -c user.name=ci -c user.email=ci@example.com commit -qm "build log"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-log
      - uses: actions/upload-artifact@v4
        with:
          name: Liner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
